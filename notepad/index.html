<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Quick Note Pro</title>
<style>
body{
    margin:0;
    background:#ffffff;
}
.toolbar{
    position:fixed;
    top:0;
    width:100%;
    background:#f5f5f5;
    padding:6px 10px;
    display:flex;
    align-items:center;
    gap:8px;
    border-bottom:1px solid #ddd;
    font-family:Arial;
}
button, select{
    padding:4px 8px;
    cursor:pointer;
    border:1px solid #ccc;
    background:#fff;
}
#stats{
    margin-left:auto;
    font-size:14px;
    color:#555;
}
textarea{
    margin-top:42px;
    width:100%;
    height:calc(100vh - 42px);
    border:none;
    outline:none;
    resize:none;
    padding:20px;
    font-size:18px;
    font-family:Arial;
    box-sizing:border-box;
}
</style>
</head>
<body>

<div class="toolbar">

    <button onclick="toggleBold()"><b>B</b></button>

    <select onchange="changeFontSize(this.value)">
        <option value="14px">14px</option>
        <option value="16px">16px</option>
        <option value="18px" selected>18px</option>
        <option value="20px">20px</option>
        <option value="24px">24px</option>
        <option value="28px">28px</option>
    </select>

    <select onchange="changeFont(this.value)">
        <option value="Arial">Arial</option>
        <option value="Tahoma">Tahoma</option>
        <option value="Times New Roman">Times</option>
        <option value="Courier New">Courier</option>
        <option value="Verdana">Verdana</option>
    </select>

    <button onclick="insertIcon()">Icon</button>
    <button onclick="copyText()">Copy</button>
    <button onclick="download()">Tải</button>
    <button onclick="clearText()">Xóa hết</button>

    <div id="stats">0 ký tự | 0 dòng | 0 từ</div>
</div>

<textarea id="note" placeholder="Gõ nội dung..."></textarea>

<script>
const textarea = document.getElementById("note");
const stats = document.getElementById("stats");

// Load nội dung
textarea.value = localStorage.getItem("quicknote") || "";
updateStats();

// Auto save
textarea.addEventListener("input", ()=>{
    localStorage.setItem("quicknote", textarea.value);
    updateStats();
});

// Thống kê
function updateStats(){
    const text = textarea.value;
    const chars = text.length;
    const lines = text ? text.split("\n").length : 0;
    const words = text.trim() ? text.trim().split(/\s+/).length : 0;
    stats.innerText = chars + " ký tự | " + lines + " dòng | " + words + " từ";
}

// Bold toàn bộ
function toggleBold(){
    textarea.style.fontWeight =
        textarea.style.fontWeight === "bold" ? "normal" : "bold";
}

// Đổi cỡ chữ
function changeFontSize(size){
    textarea.style.fontSize = size;
}

// Đổi font
function changeFont(font){
    textarea.style.fontFamily = font;
}

// Chèn icon ngẫu nhiên
function insertIcon(){
    const icons = ["🔥","🚀","✅","💰","📌","⭐","⚡","🎯","💡","📢","📈","👑"];
    const random = icons[Math.floor(Math.random()*icons.length)];
    const start = textarea.selectionStart;
    const end = textarea.selectionEnd;
    const text = textarea.value;
    textarea.value = text.substring(0,start) + random + text.substring(end);
    textarea.focus();
    textarea.selectionStart = textarea.selectionEnd = start + 2;
    localStorage.setItem("quicknote", textarea.value);
    updateStats();
}

// Copy
function copyText(){
    navigator.clipboard.writeText(textarea.value);
    alert("Đã copy!");
}

// Tải file
function download(){
    const blob = new Blob([textarea.value], {type:"text/plain"});
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "note.txt";
    link.click();
}

// Xóa hết
function clearText(){
    if(confirm("Xóa toàn bộ nội dung?")){
        textarea.value = "";
        localStorage.removeItem("quicknote");
        updateStats();
    }
}
</script>

</body>
</html>
