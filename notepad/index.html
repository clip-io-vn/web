<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Quick Note</title>
<style>
body{
    margin:0;
    font-family:Arial;
    background:#ffffff;
}
.toolbar{
    position:fixed;
    top:0;
    width:100%;
    background:#f5f5f5;
    padding:6px 10px;
    display:flex;
    align-items:center;
    gap:8px;
    border-bottom:1px solid #ddd;
}
button, select{
    padding:4px 8px;
    cursor:pointer;
}
#stats{
    margin-left:auto;
    font-size:14px;
    color:#555;
}
textarea{
    margin-top:42px;
    width:100%;
    height:calc(100vh - 42px);
    border:none;
    outline:none;
    resize:none;
    padding:20px;
    font-size:18px;
    box-sizing:border-box;
}
</style>
</head>
<body>

<div class="toolbar">
    <button onclick="toggleBold()"><b>B</b></button>

    <select onchange="changeFontSize(this.value)">
        <option value="14px">14px</option>
        <option value="16px">16px</option>
        <option value="18px" selected>18px</option>
        <option value="20px">20px</option>
        <option value="24px">24px</option>
        <option value="28px">28px</option>
    </select>

    <button onclick="saveLocal()">Lưu</button>
    <button onclick="download()">Tải</button>
    <button onclick="clearText()">Xóa hết</button>

    <div id="stats">0 ký tự | 0 dòng</div>
</div>

<textarea id="note" placeholder="Gõ nội dung..."></textarea>

<script>
const textarea = document.getElementById("note");
const stats = document.getElementById("stats");

// Load nếu đã lưu
textarea.value = localStorage.getItem("quicknote") || "";
updateStats();

// Tự cập nhật thống kê
textarea.addEventListener("input", ()=>{
    updateStats();
});

// Đếm ký tự & dòng
function updateStats(){
    const text = textarea.value;
    const chars = text.length;
    const lines = text.split("\n").length;
    stats.innerText = chars + " ký tự | " + lines + " dòng";
}

// Đổi cỡ chữ
function changeFontSize(size){
    textarea.style.fontSize = size;
}

// Toggle bold toàn bộ
function toggleBold(){
    if(textarea.style.fontWeight === "bold"){
        textarea.style.fontWeight = "normal";
    }else{
        textarea.style.fontWeight = "bold";
    }
}

// Lưu local
function saveLocal(){
    localStorage.setItem("quicknote", textarea.value);
    alert("Đã lưu!");
}

// Tải file txt
function download(){
    const blob = new Blob([textarea.value], {type:"text/plain"});
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "note.txt";
    link.click();
}

// Xóa hết
function clearText(){
    if(confirm("Xóa toàn bộ nội dung?")){
        textarea.value = "";
        updateStats();
        localStorage.removeItem("quicknote");
    }
}
</script>

</body>
</html>
