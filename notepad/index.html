<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Quick Note - HoangTuanAnh</title>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #ffffff;
    }

    .toolbar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        background: #f5f5f5;
        padding: 6px 10px;
        display: flex;
        align-items: center;
        gap: 8px;
        border-bottom: 1px solid #ddd;
        z-index: 10;
    }

    .toolbar button, .toolbar select {
        font-size: 14px;
        padding: 4px 8px;
        border: 1px solid #ccc;
        background: white;
        cursor: pointer;
    }

    #editor {
        margin-top: 42px;
        padding: 20px;
        width: 100%;
        height: calc(100vh - 42px);
        box-sizing: border-box;
        outline: none;
        overflow-y: auto;
        font-size: 18px;
    }
</style>
</head>
<body>

<div class="toolbar">
    <button onclick="formatText('bold')"><b>B</b></button>
    <button onclick="formatText('italic')"><i>I</i></button>

    <select onchange="changeFontSize(this.value)">
        <option value="14px">14px</option>
        <option value="16px">16px</option>
        <option value="18px" selected>18px</option>
        <option value="20px">20px</option>
        <option value="24px">24px</option>
        <option value="28px">28px</option>
    </select>

    <button onclick="copyText()">Copy</button>
    <button onclick="download()">Lưu</button>
</div>

<div id="editor" contenteditable="true"></div>

<script>
const editor = document.getElementById("editor");

// Load nội dung khi mở
editor.innerHTML = localStorage.getItem("quicknote") || "";

// Tự động lưu
editor.addEventListener("input", () => {
    localStorage.setItem("quicknote", editor.innerHTML);
});

// Format text
function formatText(command) {
    document.execCommand(command, false, null);
}

// Đổi cỡ chữ
function changeFontSize(size) {
    editor.style.fontSize = size;
}

// Copy nội dung
function copyText() {
    navigator.clipboard.writeText(editor.innerText);
    alert("Đã copy!");
}

// Tải file
function download() {
    const blob = new Blob([editor.innerText], { type: "text/plain" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "note.txt";
    link.click();
}
</script>

</body>
</html>
